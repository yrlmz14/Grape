name: Build Jail-Juice iOS (.ipa)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Jail-Juice IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          for xcode in /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          xcodebuild -version

      - name: Install Build Tools via Homebrew
        run: |
          brew install ldid zip || true
          python3 -m pip install --break-system-packages pillow || pip3 install pillow || true

      - name: Build Launchers (grape-trace-parent & grape-nested-wrapper)
        run: |
          echo "🍇 Building Grape JIT launchers..."
          chmod +x scripts/*.sh 2>/dev/null || true
          bash scripts/build-launchers.sh

      - name: Build UIKit App and Assemble Payload
        run: |
          echo "🍇 Compiling UIKit Application and assembling Payload/Juice.app..."
          rm -rf build/Payload dist
          mkdir -p build/Payload dist

          # 1. Build the app binary
          if [ -d "Juice.xcodeproj" ]; then
            echo "Building via Xcode project..."
            xcodebuild \
              -project Juice.xcodeproj \
              -scheme Juice \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              clean build || true
          fi

          XCODE_APP="$(find build/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)"
          if [ -n "$XCODE_APP" ] && [ -f "$XCODE_APP/Juice" ]; then
            echo "Using Xcode built app from $XCODE_APP"
            cp -R "$XCODE_APP" build/Payload/Juice.app
          else
            echo "Compiling Juice.app directly via clang script..."
            export JUICE_APP_BUILD_DIR="$PWD/build/Payload/Juice.app"
            bash scripts/build-app.sh
          fi

          # 2. Ensure Info.plist is present and valid
          cp config/Info.plist build/Payload/Juice.app/Info.plist
          sed -i '' 's#\$(PRODUCT_BUNDLE_IDENTIFIER)#com.jailjuice.ios#g' build/Payload/Juice.app/Info.plist 2>/dev/null || true

          # 3. Copy launcher binaries
          mkdir -p build/Payload/Juice.app/bin
          if [ -d "build/launchers" ]; then
            cp build/launchers/* build/Payload/Juice.app/bin/ 2>/dev/null || true
            cp build/launchers/* build/Payload/Juice.app/ 2>/dev/null || true
          fi

          # 4. Download and bundle verified full Wine Grape runtime
          echo "🍇 Downloading verified Grape Wine runtime..."
          curl -sSL "https://github.com/ExoCore-Kernel/Juice/releases/download/v0.2.0-rc2/Juice-v0.2.0-rc2.tipa" -o /tmp/juice_base.zip || true
          
          if [ -f /tmp/juice_base.zip ]; then
            echo "Extracting bundled Wine runtime from core release..."
            unzip -q /tmp/juice_base.zip -d /tmp/juice_extracted/ || true
            CORE_APP="$(find /tmp/juice_extracted -name "*.app" -type d | head -n 1)"
            if [ -d "$CORE_APP/Grape" ]; then
              cp -R "$CORE_APP/Grape" build/Payload/Juice.app/
            fi
            if [ -d "$CORE_APP/Grape-X64" ]; then
              cp -R "$CORE_APP/Grape-X64" build/Payload/Juice.app/
            fi
            if [ -d "$CORE_APP/Libraries" ]; then
              cp -R "$CORE_APP/Libraries" build/Payload/Juice.app/
            fi
            if [ -d "$CORE_APP/Frameworks" ]; then
              cp -R "$CORE_APP/Frameworks" build/Payload/Juice.app/
            fi
            rm -rf /tmp/juice_base.zip /tmp/juice_extracted
          fi

          # Ensure tools/ and bundle root contain wineserver, wine, and grape launchers (enables Sideloadly codesigning)
          mkdir -p build/Payload/Juice.app/Grape/tools build/Payload/Juice.app/Grape-X64/tools build/Payload/Juice.app/bin
          if [ -d "build/launchers" ]; then
            cp build/launchers/* build/Payload/Juice.app/Grape/tools/ 2>/dev/null || true
            cp build/launchers/* build/Payload/Juice.app/Grape-X64/tools/ 2>/dev/null || true
            cp build/launchers/* build/Payload/Juice.app/bin/ 2>/dev/null || true
            cp build/launchers/grape-trace-parent build/Payload/Juice.app/grape-trace-parent 2>/dev/null || true
            cp build/launchers/grape-nested-wrapper build/Payload/Juice.app/grape-nested-wrapper 2>/dev/null || true
          fi
          if [ -f "build/Payload/Juice.app/Grape/build/wine-ios/server/wineserver" ]; then
            cp build/Payload/Juice.app/Grape/build/wine-ios/server/wineserver build/Payload/Juice.app/wineserver
          fi
          if [ -f "build/Payload/Juice.app/Grape/build/wine-ios/loader/wine" ]; then
            cp build/Payload/Juice.app/Grape/build/wine-ios/loader/wine build/Payload/Juice.app/wine
          fi

          # 5. Clean dosdevices symlinks (must not contain static colons or root symlinks that break Sideloadly / Windows unzip)
          rm -rf build/Payload/Juice.app/Grape/prefix-template/dosdevices 2>/dev/null || true
          rm -rf build/Payload/Juice.app/Grape-X64/prefix-template/dosdevices 2>/dev/null || true
          mkdir -p build/Payload/Juice.app/Grape/prefix-template/dosdevices
          mkdir -p build/Payload/Juice.app/Grape-X64/prefix-template/dosdevices
          mkdir -p build/Payload/Juice.app/Grape/prefix-template/drive_c/windows/system32
          mkdir -p build/Payload/Juice.app/Grape-X64/prefix-template/drive_c/windows/system32
          find build/Payload -name "*:*" -delete 2>/dev/null || true

          # Set executable permissions on all binaries and dylibs
          chmod -R 0755 build/Payload/Juice.app/Grape/build/wine-ios/ 2>/dev/null || true
          chmod -R 0755 build/Payload/Juice.app/Grape-X64/build/wine-ios/ 2>/dev/null || true
          chmod -R 0755 build/Payload/Juice.app/Libraries/ 2>/dev/null || true
          chmod -R 0755 build/Payload/Juice.app/bin/ 2>/dev/null || true
          chmod 0755 build/Payload/Juice.app/Juice 2>/dev/null || true

          # 6. Generate app icons
          python3 scripts/generate-app-icons.py build/Payload/Juice.app 2>/dev/null || true

          # 7. Apply JIT code signing entitlements
          if command -v ldid >/dev/null 2>&1; then
            ldid -Sconfig/jailed-entitlements.plist build/Payload/Juice.app/Juice 2>/dev/null || true
            find build/Payload/Juice.app -name "wine" -o -name "wineserver" -o -name "grape-*" | while read -r bin; do
              ldid -Sconfig/jailed-child-entitlements.plist "$bin" 2>/dev/null || true
            done
          fi

          # Verify Payload structure
          echo "=== Verifying Payload/Juice.app Structure ==="
          ls -la build/Payload/Juice.app/
          test -f build/Payload/Juice.app/Info.plist || { echo "❌ ERROR: Info.plist missing!"; exit 1; }
          test -f build/Payload/Juice.app/Juice || { echo "❌ ERROR: Main binary missing!"; exit 1; }
          test -f build/Payload/Juice.app/Grape/build/wine-ios/loader/wine || { echo "❌ ERROR: Wine loader missing!"; exit 1; }
          echo "✅ Wine loader found: $(ls -la build/Payload/Juice.app/Grape/build/wine-ios/loader/wine)"
          echo "✅ Payload structure validated successfully."

      - name: Package Jail-Juice IPA
        run: |
          echo "🍇 Creating unsigned Jail-Juice.ipa..."
          OUTPUT_IPA="$PWD/dist/Jail-Juice.ipa"
          (cd build && zip -qry "$OUTPUT_IPA" Payload)
          cp "$OUTPUT_IPA" "$PWD/dist/Jail-Juice.tipa"

          echo "=== Verifying IPA Archive Contents ==="
          unzip -l "$OUTPUT_IPA" | grep "Info.plist"
          unzip -l "$OUTPUT_IPA" | grep "Payload/Juice.app/Juice"

      - name: Upload Jail-Juice IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jail-Juice-ipa
          path: dist/Jail-Juice.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Jail-Juice.ipa
            dist/Jail-Juice.tipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
